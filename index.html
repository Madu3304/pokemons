<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex - Consumindo PokeAPI</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fonte Google para visual moderno -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="pokeball-icon"></div>
      <h1>Pokédex API</h1>
      <p>Consumo da <strong>PokeAPI</strong> via JavaScript (<code>fetch</code>)</p>
    </header>

    <!-- Barra de Pesquisa -->
    <section class="search-section">
      <form id="search-form" class="search-form">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Digite o nome ou ID (ex: ditto, 25, pikachu)..." 
          autocomplete="off"
          required
        >
        <button type="submit" id="search-button">Buscar</button>
      </form>

      <!-- Botões de atalho rápido -->
      <div class="quick-tags">
        <span>Sugestões:</span>
        <button type="button" class="tag-btn" data-pokemon="ditto">Ditto</button>
        <button type="button" class="tag-btn" data-pokemon="pikachu">Pikachu</button>
        <button type="button" class="tag-btn" data-pokemon="charizard">Charizard</button>
        <button type="button" class="tag-btn" data-pokemon="gengar">Gengar</button>
        <button type="button" class="tag-btn" data-pokemon="mewtwo">Mewtwo</button>
      </div>
    </section>

    <!-- Área de Feedback / Loading -->
    <div id="status-message" class="status-message" style="display: none;"></div>

    <!-- Card de exibição do Pokémon -->
    <main id="pokemon-card" class="pokemon-card">
      <div class="card-header">
        <span id="pokemon-id" class="pokemon-id">#132</span>
        <h2 id="pokemon-name" class="pokemon-name">Ditto</h2>
      </div>

      <div class="pokemon-image-container">
        <img id="pokemon-img" src="" alt="Imagem do Pokémon" class="pokemon-img">
      </div>

      <!-- Tipos -->
      <div id="pokemon-types" class="pokemon-types">
        <!-- Badges geradas via JS -->
      </div>

      <!-- Informações Físicas -->
      <div class="pokemon-info-grid">
        <div class="info-box">
          <span class="info-label">Peso</span>
          <span id="pokemon-weight" class="info-value">4.0 kg</span>
        </div>
        <div class="info-box">
          <span class="info-label">Altura</span>
          <span id="pokemon-height" class="info-value">0.3 m</span>
        </div>
      </div>

      <!-- Habilidades -->
      <div class="abilities-container">
        <h3>Habilidades</h3>
        <div id="pokemon-abilities" class="abilities-list">
          <!-- Gerado via JS -->
        </div>
      </div>

      <!-- Estatísticas Base -->
      <div class="stats-container">
        <h3>Estatísticas Base</h3>
        <div id="pokemon-stats" class="stats-list">
          <!-- Gerado via JS -->
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>Dados fornecidos por <a href="https://pokeapi.co/" target="_blank" rel="noopener noreferrer">PokeAPI</a></p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
